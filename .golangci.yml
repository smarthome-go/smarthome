version: "2"
linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
  disable:
    - unused
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
